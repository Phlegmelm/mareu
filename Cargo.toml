[package]
name = "mareu"
version = "0.4.0"
edition = "2021"
rust-version = "1.74"
description = "A terminal utility for vulnerability research, exploit development, and security tooling"
authors = ["@Phlegmelm"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/phlegmelm/mareu"
readme = "README.md"
keywords = ["security", "vulnerability-research", "exploit", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "mareu"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
clap_mangen = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
async-trait = "0.1"
rustyline = "14"
handlebars = "6"
indicatif = "0.17"
anyhow = "1"
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
futures-util = "0.3"
aho-corasick = "1"

[target.'cfg(windows)'.dependencies]
enable-ansi-support = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
