name: Release

# Trigger by pushing a version tag:
#   git tag v0.4.0 && git push origin v0.4.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    name: ${{ matrix.target }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Builds the binary (cross-compiling where needed), archives it with the
      # docs/licenses, generates a sha256 checksum, and attaches it to the
      # release created above.
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: mareu
          target: ${{ matrix.target }}
          archive: mareu-$tag-$target
          include: README.md,LICENSE-MIT,LICENSE-APACHE,SECURITY.md,CHANGELOG.md
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
